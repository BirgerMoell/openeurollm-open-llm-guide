<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">OpenEuroLLM Guide Icon</title>
  <desc id="desc">Shock pink square with a blue orbital OpenEuroLLM guide mark.</desc>
  <defs>
    <linearGradient id="pink" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ff72bd"/>
      <stop offset="0.52" stop-color="#f75cac"/>
      <stop offset="1" stop-color="#ef4fa3"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#7b174f" flood-opacity="0.22"/>
