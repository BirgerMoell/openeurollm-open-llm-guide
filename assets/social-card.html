<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1200, initial-scale=1" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #11182c;
        background:
          radial-gradient(circle at 88% 12%, rgba(255,255,255,0.22), transparent 270px),
          linear-gradient(145deg, #ff72bd 0%, #f75cac 48%, #ef4fa3 100%);
      }
      .wrap {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 62px 72px;
      }
      .kicker {
        color: rgba(255,255,255,0.9);
        font-size: 25px;
        font-weight: 950;
        letter-spacing: 0.19em;
        text-transform: uppercase;
      }
      .rule {
        width: 670px;
        height: 6px;
        margin: 58px 0 30px;
        background: #064c93;
      }
      h1 {
        width: 760px;
        margin: 0;
        font-size: 82px;
        line-height: 0.98;
        letter-spacing: 0;
      }
      p {
        width: 760px;
        margin: 26px 0 0;
        color: rgba(255,255,255,0.94);
        font-size: 28px;
        line-height: 1.34;
      }
      .icon {
        position: absolute;
        right: 76px;
        bottom: 72px;
        width: 214px;
        height: 214px;
        border-radius: 46px;
        background: rgba(255,255,255,0.12);
        border: 2px solid rgba(255,255,255,0.36);
        display: grid;
        place-items: center;
      }
      .icon img {
        width: 156px;
        height: 156px;
      }
      .chips {
        position: absolute;
        left: 72px;
        bottom: 66px;
        display: flex;
        gap: 14px;
      }
      .chips span {
        min-height: 44px;
        padding: 8px 18px;
        border: 1.5px solid rgba(255,255,255,0.42);
        border-radius: 999px;
        color: #fff;
        font-size: 21px;
        font-weight: 900;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="kicker">OpenEuroLLM · Technical Blueprint · 2026</div>
      <div class="rule"></div>
      <h1>The 2026 Fully Open LLM Training Guide</h1>
      <p>Citation-grounded systems guidance for training, evaluating, post-training, and releasing open multilingual foundation models.</p>
      <div class="chips">
        <span>Data lineage</span>
        <span>MoE</span>
        <span>GRPO / RLHF / DPO</span>
      </div>
      <div class="icon">
        <img src="icon.svg" alt="" />
      </div>
    </main>
  </body>
</html>
